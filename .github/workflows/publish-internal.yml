name: Publish internal
on:
  push:
    branches:
      - 'main'

jobs:
  publish-android:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Prepare secrets
      env:
        FASTLANE_GOOGLE_PLAY_KEY_FILE: ${{ secrets.FASTLANE_GOOGLE_PLAY_KEY_FILE }}
        ANDROID_RELEASE_KEYSTORE_PROPERTIES_FILE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PROPERTIES_FILE }}

      run: |
        echo "$FASTLANE_GOOGLE_PLAY_KEY_FILE" >> ./deploy/keystore/android/fastlane-google-play-key.json
        echo "$ANDROID_RELEASE_KEYSTORE_PROPERTIES_FILE" >> ./deploy/keystore/android/keystore.properties

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
        bundler: '2.6.4'

    - name: Run Fastlane
      env:
        BUNDLE_GEMFILE: ../../deploy/fastlane/Gemfile
        FASTLANE_FILE: ../../deploy/fastlane/Fastfile
      working-directory: ./kboy/android
      run: |
        bundle install
        bundle exec fastlane internal_testing