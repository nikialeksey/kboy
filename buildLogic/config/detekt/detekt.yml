complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 15
    ignoreSingleWhenExpression: false
    ignoreSimpleWhenEntries: false
    ignoreNestingFunctions: false
    nestingFunctions:
      - 'also'
      - 'apply'
      - 'forEach'
      - 'isNotNull'
      - 'ifNull'
      - 'let'
      - 'run'
      - 'use'
      - 'with'
    excludes: [
      '**/gb/**'
    ]
  LabeledExpression:
    active: false
    ignoredLabels: []
  LongMethod:
    active: true
    allowedLines: 60
    excludes: [
      '**/gb/**'
    ]
  LongParameterList:
    active: true
    allowedFunctionParameters: 6
    allowedConstructorParameters: 7
    ignoreDefaultParameters: false
    ignoreDataClasses: true
    ignoreAnnotatedParameter: []
    excludes: [
      '**/gb/**'
    ]
  NestedBlockDepth:
    active: true
    allowedDepth: 4
    excludes: [
      '**/gb/**',
    ]
  TooManyFunctions:
    active: true
    excludes: [
      '**/gb/**',

      '**/test/**',
      '**/androidTest/**',
      '**/commonTest/**',
      '**/jvmTest/**',
      '**/androidUnitTest/**',
      '**/androidInstrumentedTest/**',
      '**/jsTest/**',
      '**/iosTest/**'
    ]
    allowedFunctionsPerFile: 11
    allowedFunctionsPerClass: 11
    allowedFunctionsPerInterface: 11
    allowedFunctionsPerObject: 11
    allowedFunctionsPerEnum: 11
    ignoreDeprecated: false
    ignorePrivate: false
    ignoreOverridden: false
    ignoreAnnotatedFunctions: []

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  active: true
  ExpressionBodySyntax:
    active: false
  MagicNumber:
    active: true
    excludes: [
      '**/gb/**',
      '**/screens/**',

      '**/test/**',
      '**/androidTest/**',
      '**/commonTest/**',
      '**/jvmTest/**',
      '**/androidUnitTest/**',
      '**/androidInstrumentedTest/**',
      '**/jsTest/**',
      '**/iosTest/**',
      '**/*.kts'
    ]
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: false
    ignoreLocalVariableDeclaration: false
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: false
    ignoreNamedArgument: true
    ignoreEnums: false
    ignoreRanges: false
    ignoreExtensionFunctions: true

ktlint:
  active: true
  FunctionExpressionBody:
    active: false
  BlankLineBetweenWhenConditions:
    active: false
  ClassSignature:
    active: true
    forceMultilineWhenParameterCountGreaterOrEqualThan: '1'
  FunctionSignature:
    active: true
    forceMultilineWhenParameterCountGreaterOrEqualThan: 3